services:
  mysql:
    image: mysql:8.0
    container_name: mufeng-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456       # 改回微服务里的 123456
      MYSQL_DATABASE: mufeng            # 改回微服务里的 mufeng
      TZ: Asia/Shanghai
    volumes:
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.2-alpine
    container_name: mufeng-redis
    ports:
      - "6379:6379"
    # 确保docker重启后密码依然生效
    command: redis-server --requirepass 123456  
    
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: mufeng-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m

  rmqnamesrv:
    image: apache/rocketmq:5.2.0
    container_name: mufeng-rmqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:5.2.0
    container_name: mufeng-rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.2.0/conf/broker.conf:ro
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    depends_on:
      - rmqnamesrv